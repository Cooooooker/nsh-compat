name: CI

# The checks, against NSH's `main` (NSH's own Compat workflow runs them
# against each of its pull requests).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUSTUP_TOOLCHAIN: stable

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Side by side: the crates depend on `../nsh`.
      - uses: actions/checkout@v4
        with:
          path: nsh-compat

      - uses: actions/checkout@v4
        with:
          repository: longbridge/nsh
          path: nsh

      # QuickJS is C (bindgen needs libclang).
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nsh
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build nsh
        working-directory: nsh
        run: cargo build -p nsh-cli

      - name: Check
        working-directory: nsh-compat
        run: |
          cp ../nsh/Cargo.lock .
          cargo fmt --check
          cargo clippy --all-targets --target-dir ../nsh/target -- -D warnings
          cargo test --target-dir ../nsh/target
